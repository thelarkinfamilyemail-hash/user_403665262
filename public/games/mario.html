<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Mario Bros</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: #5c94fc; color: #fff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    #hud { width: 560px; max-width: 95vw; display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; margin-bottom: 6px; text-shadow: 2px 2px #000; }
    canvas { background: #5c94fc; border: 3px solid #000; border-radius: 6px; width: 560px; height: 320px; max-width: 95vw; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .hint { margin-top: 8px; font-size: 12px; color: #000; font-weight: bold; }
  </style>
</head>
<body>
  <div id="hud">
    <span>MARIO: <span id="score">000000</span></span>
    <span>COINS: x<span id="coins">00</span></span>
    <span>WORLD: 1-1</span>
    <span>TIME: <span id="time">360</span></span>
  </div>
  <canvas id="c" width="560" height="320"></canvas>
  <div class="hint">[A / D or Left / Right] Walk/Run · [W / Up / Space] Jump</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const coinsEl = document.getElementById('coins');

    let score = 0, coins = 0;
    let cameraX = 0;
    let over = false, won = false;

    let mario = {
      x: 60,
      y: 240,
      vx: 0,
      vy: 0,
      w: 18,
      h: 26,
      grounded: true,
      facingRight: true
    };

    let blocks = [
      { x: 200, y: 190, w: 24, h: 24, type: 'question', hit: false },
      { x: 224, y: 190, w: 24, h: 24, type: 'brick' },
      { x: 248, y: 190, w: 24, h: 24, type: 'question', hit: false },
      { x: 272, y: 190, w: 24, h: 24, type: 'brick' },
      { x: 296, y: 190, w: 24, h: 24, type: 'question', hit: false },
      { x: 420, y: 190, w: 24, h: 24, type: 'brick' },
      { x: 444, y: 130, w: 24, h: 24, type: 'question', hit: false },
      // Pipes
      { x: 340, y: 220, w: 34, h: 48, type: 'pipe' },
      { x: 500, y: 200, w: 34, h: 68, type: 'pipe' },
      { x: 740, y: 180, w: 34, h: 88, type: 'pipe' },
      // Flagpole at end
      { x: 1200, y: 60, w: 8, h: 208, type: 'pole' }
    ];

    let goombas = [
      { x: 300, y: 250, vx: -1.2, alive: true },
      { x: 580, y: 250, vx: -1.2, alive: true },
      { x: 700, y: 250, vx: -1.2, alive: true },
      { x: 920, y: 250, vx: -1.2, alive: true }
    ];

    const keys = {};
    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    function jump() {
      if (over || won) { restart(); return; }
      if (mario.grounded) {
        mario.vy = -12;
        mario.grounded = false;
      }
    }

    function restart() {
      mario = { x: 60, y: 240, vx: 0, vy: 0, w: 18, h: 26, grounded: true, facingRight: true };
      score = 0; coins = 0; cameraX = 0; over = false; won = false;
      blocks.forEach(b => b.hit = false);
      goombas.forEach((g, i) => { g.x = 300 + i * 200; g.vx = -1.2; g.alive = true; });
      scoreEl.textContent = '000000';
      coinsEl.textContent = '00';
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'KeyW', 'Space'].includes(e.code)) { jump(); e.preventDefault(); }
    });

    function update() {
      if (over || won) return;

      // Mario movement
      if (keys['ArrowRight'] || keys['KeyD']) { mario.vx += 0.4; mario.facingRight = true; }
      else if (keys['ArrowLeft'] || keys['KeyA']) { mario.vx -= 0.4; mario.facingRight = false; }
      else { mario.vx *= 0.8; }

      mario.vx = Math.max(-4.2, Math.min(4.2, mario.vx));
      mario.x += mario.vx;

      // Gravity
      mario.vy += 0.7;
      mario.y += mario.vy;

      // Ground (y = 268)
      if (mario.y >= 242) {
        mario.y = 242;
        mario.vy = 0;
        mario.grounded = true;
      }

      // Block collisions
      for (let b of blocks) {
        if (mario.x + mario.w > b.x && mario.x < b.x + b.w) {
          // Landing on top
          if (mario.vy > 0 && mario.y + mario.h >= b.y && mario.y + mario.h - mario.vy <= b.y + 10) {
            mario.y = b.y - mario.h;
            mario.vy = 0;
            mario.grounded = true;
          }
          // Hitting from bottom
          else if (mario.vy < 0 && mario.y <= b.y + b.h && mario.y - mario.vy >= b.y + b.h - 10) {
            mario.y = b.y + b.h;
            mario.vy = 1;
            if (b.type === 'question' && !b.hit) {
              b.hit = true;
              coins++;
              score += 200;
              coinsEl.textContent = String(coins).padStart(2, '0');
              scoreEl.textContent = String(score).padStart(6, '0');
            }
          }
        }
      }

      // Camera follows Mario
      if (mario.x - cameraX > 220) {
        cameraX = mario.x - 220;
      }

      // Goombas AI
      for (let g of goombas) {
        if (!g.alive) continue;
        g.x += g.vx;

        // Collision with Mario
        if (mario.x + mario.w > g.x && mario.x < g.x + 20 &&
            mario.y + mario.h > g.y && mario.y < g.y + 20) {
          // Mario jumps on Goomba head
          if (mario.vy > 0 && mario.y + mario.h < g.y + 12) {
            g.alive = false;
            mario.vy = -7;
            score += 100;
            scoreEl.textContent = String(score).padStart(6, '0');
          } else {
            over = true;
          }
        }
      }

      // Flagpole win (x = 1200)
      if (mario.x >= 1200) {
        won = true;
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Clouds & Bushes
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 8; i++) {
        let cx = (i * 260) - cameraX * 0.3;
        ctx.beginPath(); ctx.arc(cx, 60, 24, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 20, 50, 32, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 44, 60, 22, 0, Math.PI*2); ctx.fill();
      }

      // Ground (Brown dirt + green grass top)
      ctx.fillStyle = '#c84c0c';
      ctx.fillRect(0, 268, canvas.width, 52);
      ctx.fillStyle = '#00a800';
      ctx.fillRect(0, 268, canvas.width, 6);

      // Blocks
      for (let b of blocks) {
        let sx = b.x - cameraX;
        if (sx < -40 || sx > canvas.width + 40) continue;

        if (b.type === 'pipe') {
          ctx.fillStyle = '#00a800';
          ctx.fillRect(sx, b.y, b.w, b.h);
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.strokeRect(sx, b.y, b.w, b.h);
        } else if (b.type === 'question') {
          ctx.fillStyle = b.hit ? '#9c4a00' : '#fc9838';
          ctx.fillRect(sx, b.y, b.w, b.h);
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.strokeRect(sx, b.y, b.w, b.h);
          if (!b.hit) {
            ctx.fillStyle = '#000';
            ctx.font = 'bold 16px monospace';
            ctx.fillText('?', sx + 7, b.y + 18);
          }
        } else if (b.type === 'brick') {
          ctx.fillStyle = '#c84c0c';
          ctx.fillRect(sx, b.y, b.w, b.h);
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.strokeRect(sx, b.y, b.w, b.h);
        } else if (b.type === 'pole') {
          ctx.fillStyle = '#fff';
          ctx.fillRect(sx, b.y, b.w, b.h);
          ctx.fillStyle = '#00a800';
          ctx.beginPath();
          ctx.arc(sx + 4, b.y, 10, 0, Math.PI*2);
          ctx.fill();
        }
      }

      // Goombas
      for (let g of goombas) {
        if (!g.alive) continue;
        let gx = g.x - cameraX;
        ctx.fillStyle = '#9c4a00';
        ctx.beginPath();
        ctx.arc(gx + 10, g.y + 10, 10, Math.PI, 0);
        ctx.lineTo(gx + 18, g.y + 20);
        ctx.lineTo(gx + 2, g.y + 20);
        ctx.fill();
        // Eyes
        ctx.fillStyle = '#fff';
        ctx.fillRect(gx + 4, g.y + 8, 3, 5);
        ctx.fillRect(gx + 13, g.y + 8, 3, 5);
      }

      // Mario
      let mx = mario.x - cameraX;
      // Cap & Shirt
      ctx.fillStyle = '#fc1c00';
      ctx.fillRect(mx + 2, mario.y, 14, 8); // cap
      ctx.fillRect(mx, mario.y + 8, 18, 10); // shirt
      // Overalls (Blue)
      ctx.fillStyle = '#0028fc';
      ctx.fillRect(mx + 2, mario.y + 14, 14, 12);
      // Face
      ctx.fillStyle = '#fcb040';
      ctx.fillRect(mario.facingRight ? mx + 8 : mx + 2, mario.y + 4, 8, 6);

      if (over) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fc1c00';
        ctx.font = 'bold 30px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', 280, 140);
        ctx.fillStyle = '#fff';
        ctx.font = '16px monospace';
        ctx.fillText('Press SPACE to Try Again', 280, 180);
      } else if (won) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fde047';
        ctx.font = 'bold 30px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('COURSE CLEAR! 🎉', 280, 140);
        ctx.fillStyle = '#fff';
        ctx.font = '16px monospace';
        ctx.fillText('Score: ' + score + ' · Press SPACE to Play Again', 280, 180);
      }
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
