<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Geometry Dash Lite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: #09090b; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    #hud { width: 560px; max-width: 95vw; display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .top-stats { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; color: #a855f7; }
    #progress-container { width: 100%; height: 10px; background: #27272a; border-radius: 5px; overflow: hidden; border: 1px solid #3f3f46; }
    #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #a855f7, #ec4899); transition: width 0.1s linear; }
    canvas { background: #18181b; border: 3px solid #a855f7; border-radius: 8px; width: 560px; height: 280px; max-width: 95vw; cursor: pointer; box-shadow: 0 0 25px rgba(168,85,247,0.3); }
    .hint { margin-top: 8px; font-size: 12px; color: #71717a; }
  </style>
</head>
<body>
  <div id="hud">
    <div class="top-stats">
      <span>ATTEMPT <span id="attempt">1</span></span>
      <span>PROGRESS: <span id="percent">0%</span></span>
    </div>
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>
  </div>
  <canvas id="c" width="560" height="280"></canvas>
  <div class="hint">Click Canvas or Press [SPACE] to Jump</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const percentEl = document.getElementById('percent');
    const barEl = document.getElementById('progress-bar');
    const attemptEl = document.getElementById('attempt');

    let attempt = 1;
    let over = false, won = false;
    let cameraX = 0;
    const LEVEL_LENGTH = 3800;

    let cube = {
      x: 60,
      y: 200,
      vy: 0,
      size: 30,
      rotation: 0,
      isGrounded: true
    };

    // Synthesized Sound FX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type='sine', dur=0.08) {
      try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    // Build level obstacles
    let obstacles = [];
    function buildLevel() {
      obstacles = [];
      for (let x = 300; x < LEVEL_LENGTH; x += 180 + Math.random() * 120) {
        let type = Math.random() < 0.65 ? 'spike' : (Math.random() < 0.5 ? 'block' : 'double_spike');
        if (type === 'spike') {
          obstacles.push({ x: x, y: 220, w: 26, h: 26, type: 'spike' });
        } else if (type === 'double_spike') {
          obstacles.push({ x: x, y: 220, w: 52, h: 26, type: 'double_spike' });
        } else {
          obstacles.push({ x: x, y: 194, w: 32, h: 26, type: 'block' });
          if (Math.random() < 0.5) {
            obstacles.push({ x: x + 60, y: 220, w: 26, h: 26, type: 'spike' });
          }
        }
      }
    }
    buildLevel();

    function jump() {
      if (over || won) { restart(); return; }
      if (cube.isGrounded) {
        cube.vy = -10.5;
        cube.isGrounded = false;
        playBeep(520, 'square', 0.1);
      }
    }

    function restart() {
      attempt++;
      attemptEl.textContent = attempt;
      cube.x = 60;
      cube.y = 190;
      cube.vy = 0;
      cube.rotation = 0;
      cube.isGrounded = true;
      cameraX = 0;
      over = false;
      won = false;
      buildLevel();
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') { jump(); e.preventDefault(); }
    });
    canvas.addEventListener('pointerdown', jump);

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!over && !won) {
        // Run forward
        cube.x += 6.5;
        cameraX = cube.x - 80;

        // Gravity
        cube.vy += 0.65;
        cube.y += cube.vy;

        // Ground collision (y = 220)
        if (cube.y >= 190) {
          cube.y = 190;
          cube.vy = 0;
          cube.isGrounded = true;
          // Snap rotation to nearest 90 deg
          cube.rotation = Math.round(cube.rotation / (Math.PI/2)) * (Math.PI/2);
        } else {
          cube.isGrounded = false;
          cube.rotation += 0.14; // Spin in mid-air
        }

        // Progress
        let pct = Math.min(100, Math.floor((cube.x / LEVEL_LENGTH) * 100));
        percentEl.textContent = pct + '%';
        barEl.style.width = pct + '%';

        if (pct >= 100) {
          won = true;
          playBeep(880, 'sine', 0.4);
        }

        // Check Obstacles
        for (let o of obstacles) {
          // Block landing vs hitting face
          if (o.type === 'block') {
            if (cube.x + cube.size > o.x && cube.x < o.x + o.w) {
              if (cube.y + cube.size > o.y && cube.y < o.y + o.h) {
                // If landing on top
                if (cube.vy > 0 && cube.y + cube.size - cube.vy <= o.y + 6) {
                  cube.y = o.y - cube.size;
                  cube.vy = 0;
                  cube.isGrounded = true;
                } else {
                  over = true; playBeep(160, 'sawtooth', 0.3);
                }
              }
            }
          } else {
            // Spikes (triangle hit)
            if (cube.x + cube.size - 6 > o.x && cube.x + 6 < o.x + o.w && cube.y + cube.size > o.y) {
              over = true;
              playBeep(160, 'sawtooth', 0.3);
            }
          }
        }
      }

      // Background Grid
      ctx.fillStyle = '#0f0f17';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#272738';
      ctx.lineWidth = 1;
      let gridOffset = -(cameraX % 40);
      for (let gx = gridOffset; gx < canvas.width; gx += 40) {
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, 220); ctx.stroke();
      }

      // Neon Floor
      ctx.fillStyle = '#181824';
      ctx.fillRect(0, 220, canvas.width, 60);
      ctx.strokeStyle = '#ec4899';
      ctx.lineWidth = 3;
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ec4899';
      ctx.beginPath();
      ctx.moveTo(0, 220);
      ctx.lineTo(canvas.width, 220);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Draw Obstacles
      for (let o of obstacles) {
        let sx = o.x - cameraX;
        if (sx < -100 || sx > canvas.width + 100) continue;

        if (o.type === 'spike') {
          ctx.fillStyle = '#ef4444';
          ctx.strokeStyle = '#fca5a5';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(sx + o.w / 2, o.y);
          ctx.lineTo(sx + o.w, o.y + o.h);
          ctx.lineTo(sx, o.y + o.h);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
        } else if (o.type === 'double_spike') {
          for (let s = 0; s < 2; s++) {
            let px = sx + s * 26;
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(px + 13, o.y);
            ctx.lineTo(px + 26, o.y + o.h);
            ctx.lineTo(px, o.y + o.h);
            ctx.closePath();
            ctx.fill();
          }
        } else {
          // Block
          ctx.fillStyle = '#6366f1';
          ctx.fillRect(sx, o.y, o.w, o.h);
          ctx.strokeStyle = '#a5b4fc';
          ctx.lineWidth = 2;
          ctx.strokeRect(sx, o.y, o.w, o.h);
        }
      }

      // Draw Neon Cube
      ctx.save();
      let cx = cube.x - cameraX + cube.size / 2;
      let cy = cube.y + cube.size / 2;
      ctx.translate(cx, cy);
      ctx.rotate(cube.rotation);

      ctx.fillStyle = '#22c55e';
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#22c55e';
      ctx.fillRect(-cube.size/2, -cube.size/2, cube.size, cube.size);
      ctx.strokeStyle = '#052e16';
      ctx.lineWidth = 3;
      ctx.strokeRect(-cube.size/2, -cube.size/2, cube.size, cube.size);

      // Cube Eye
      ctx.fillStyle = '#052e16';
      ctx.fillRect(-4, -6, 8, 5);
      ctx.restore();
      ctx.shadowBlur = 0;

      if (over) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('CRASHED!', 280, 120);
        ctx.fillStyle = '#fff';
        ctx.font = '16px sans-serif';
        ctx.fillText('Press SPACE or Tap to Retry Attempt ' + (attempt + 1), 280, 160);
      } else if (won) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#22c55e';
        ctx.font = 'bold 30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('LEVEL 100% COMPLETE! 🎉', 280, 120);
        ctx.fillStyle = '#fff';
        ctx.font = '16px sans-serif';
        ctx.fillText('Click to play again', 280, 160);
      }

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
